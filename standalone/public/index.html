<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LibTV Studio</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/styles.css?v=20260820-ds-control-fullwidth" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar compact-topbar">
      <div class="workspace-crumbs">
        <button id="workspaceIcon" class="workspace-icon" title="切换画布" aria-label="打开画布列表"><img src="/brand/libtv-logo.png" alt="" aria-hidden="true"></button>
        <div id="projectSelect" class="project-select" aria-label="当前项目"></div>
        <button id="newProjectBtn" class="top-chip" title="新建画布" aria-label="新建画布"><i class="ui-icon" style="--icon:url('/vendor/icons/plus.svg')"></i></button>
        <span id="saveState" class="save-state" data-state="saved" role="status" aria-live="polite"><i class="save-state-dot" aria-hidden="true"></i><span>已保存</span></span>
      </div>
      <div class="top-actions">
        <div class="top-action-group" aria-label="资料">
          <button id="assetDrawerBtn" class="top-chip" title="素材库" aria-label="素材" aria-pressed="false"><i class="ui-icon" style="--icon:url('/vendor/icons/folders.svg')"></i><span>素材</span></button>
          <button id="skillDrawerBtn" class="top-chip" title="技能广场" aria-label="技能" aria-pressed="false"><i class="ui-icon" style="--icon:url('/vendor/icons/sparkles-2.svg')"></i><span>技能</span></button>
        </div>
        <span class="top-action-sep" aria-hidden="true"></span>
        <div class="top-action-group" aria-label="成片">
          <button id="timelineToggleBtn" class="top-chip" title="时间线" aria-label="时间线" aria-pressed="false"><i class="ui-icon" style="--icon:url('/vendor/icons/list-details.svg')"></i><span>时间线</span></button>
          <button id="exportBtn" class="top-chip" aria-label="导出"><i class="ui-icon" style="--icon:url('/vendor/icons/download.svg')"></i><span>导出</span></button>
        </div>
        <span class="top-action-sep" aria-hidden="true"></span>
        <div class="top-action-group" aria-label="模型与创意">
          <button id="providerSettingsBtn" class="top-chip" title="第三方模型 / API" aria-label="模型/API"><i class="ui-icon" style="--icon:url('/vendor/icons/adjustments-horizontal.svg')"></i><span>模型/API</span></button>
          <button id="agentBtn" class="top-chip" aria-label="Agent" aria-pressed="false"><i class="ui-icon" style="--icon:url('/vendor/icons/bulb.svg')"></i><span>Agent</span><i class="top-chip-dot hidden" aria-hidden="true"></i></button>
        </div>
      </div>
    </header>

    <main class="stage-shell">
      <section class="canvas-wrap full-canvas-wrap">
        <div id="canvas" class="canvas" tabindex="0" role="application" aria-label="无限画布">
          <div id="canvasNotice" class="canvas-notice hidden" role="alert" aria-live="assertive"></div>
          <svg id="edgesSvg" class="edges-svg"><g id="edgesLayer"></g></svg>
          <div id="canvasWorld" class="canvas-world"></div>
          <div id="welcomeCards" class="canvas-welcome hidden" aria-label="快速开始">
            <p><i class="ui-icon" style="--icon:url('/vendor/icons/click.svg')"></i> 双击画布 自由生成节点</p>
            <div class="welcome-card-list">
              <button data-welcome-action="text"><img src="/welcome-assets/text-generation.png?v=2" alt="" /><span><strong>文本生成</strong><small>从想法开始创作</small></span></button>
              <button data-welcome-action="image"><img src="/welcome-assets/image-generation.png?v=2" alt="" /><span><strong>图片生成</strong><small>生成电影级视觉画面</small></span></button>
              <button data-welcome-action="video"><img src="/welcome-assets/video-generation.png?v=2" alt="" /><span><strong>视频生成</strong><small>让画面动起来</small></span></button>
            </div>
          </div>
        </div>

        <div class="canvas-bottom-toolbar">
          <button id="addNodeBtn" class="tool-btn" title="添加节点" aria-label="添加节点"><i class="ui-icon" style="--icon:url('/vendor/icons/plus.svg')"></i></button>
          <span class="toolbar-sep"></span>
          <div class="toolbar-tool-group" id="mouseTools" aria-label="鼠标操作">
            <button data-tool="pan" class="tool-btn" title="抓手 (H)" aria-label="抓手"><i class="ui-icon" style="--icon:url('/vendor/icons/hand-stop.svg')"></i></button>
          </div>
          <span class="toolbar-sep"></span>
          <button id="canvasUndoBtn" class="tool-btn" title="撤销" aria-label="撤销"><i class="ui-icon" style="--icon:url('/vendor/icons/arrow-back-up.svg')"></i></button>
          <button id="canvasRedoBtn" class="tool-btn" title="重做" aria-label="重做"><i class="ui-icon" style="--icon:url('/vendor/icons/arrow-forward-up.svg')"></i></button>
          <span class="toolbar-sep"></span>
          <button id="runAllBtn" class="tool-btn strong" title="按依赖顺序运行整个工作流" aria-label="运行全部"><i class="ui-icon" style="--icon:url('/vendor/icons/player-play.svg')"></i></button>
          <button id="fitBtn" class="tool-btn" title="适配" aria-label="适配画布"><i class="ui-icon" style="--icon:url('/vendor/icons/arrows-maximize.svg')"></i></button>
          <button id="zoomOutBtn" class="tool-btn" title="缩小" aria-label="缩小"><i class="ui-icon" style="--icon:url('/vendor/icons/minus.svg')"></i></button>
          <span id="zoomLabel" class="zoom-label">100%</span>
          <button id="zoomInBtn" class="tool-btn" title="放大" aria-label="放大"><i class="ui-icon" style="--icon:url('/vendor/icons/plus.svg')"></i></button>
          <button id="helpBtn" class="tool-btn" title="快捷键" aria-label="快捷键"><i class="ui-icon" style="--icon:url('/vendor/icons/help-circle.svg')"></i></button>
        </div>

        <div id="connectionToast" class="connection-toast hidden">拖到目标输入端口</div>
      </section>

      <aside id="assetDrawer" class="floating-drawer right-drawer asset-drawer hidden-drawer">
        <div class="drawer-header"><strong>素材管理</strong><div><button id="uploadBtn"><i class="ui-icon" style="--icon:url('/vendor/icons/upload.svg')"></i><span>上传</span></button><button id="refreshAssetsBtn" class="icon-btn" title="刷新" aria-label="刷新"><i class="ui-icon" style="--icon:url('/vendor/icons/refresh.svg')"></i></button><button data-close-drawer="assetDrawer" class="icon-btn" title="关闭" aria-label="关闭"><i class="ui-icon" style="--icon:url('/vendor/icons/x.svg')"></i></button></div></div>
        <input id="fileInput" type="file" hidden multiple accept="image/*,video/*,audio/*" />
        <div id="assetLibraryTabs" class="asset-library-tabs" role="tablist" aria-label="素材库分类"><button class="active" data-library-tab="assets" role="tab" aria-selected="true">素材</button><button data-library-tab="prompts" role="tab" aria-selected="false">提示词库</button></div>
        <div id="assetFilterChips" class="asset-filter-chips" data-library-panel="assets">
          <div class="asset-filter-group"><span class="asset-filter-label">类型</span><div class="asset-filter-options">
            <button data-filter-kind="all" class="chip active">全部</button>
            <button data-filter-kind="image" class="chip">图片</button>
            <button data-filter-kind="video" class="chip">视频</button>
            <button data-filter-kind="audio" class="chip">音频</button>
          </div></div>
        </div>
        <div id="assetList" class="asset-list" data-library-panel="assets"></div>
        <div id="promptLibraryList" class="prompt-library-list hidden" data-library-panel="prompts"></div>
      </aside>

      <aside id="skillDrawer" class="floating-drawer right-drawer skill-drawer hidden-drawer" aria-label="技能广场">
        <div class="drawer-header"><strong>技能广场</strong><div><button id="importSkillBtn" class="icon-btn" title="导入技能" aria-label="导入技能"><i class="ui-icon" style="--icon:url('/vendor/icons/upload.svg')"></i></button><button id="refreshSkillsBtn" class="icon-btn" title="刷新技能" aria-label="刷新技能"><i class="ui-icon" style="--icon:url('/vendor/icons/refresh.svg')"></i></button><button data-close-drawer="skillDrawer" class="icon-btn" title="关闭" aria-label="关闭"><i class="ui-icon" style="--icon:url('/vendor/icons/x.svg')"></i></button></div></div>
        <div class="skill-library-toolbar"><div id="skillCategoryFilters" class="skill-category-filters" role="tablist" aria-label="技能分类"></div><label class="skill-search"><i class="ui-icon" style="--icon:url('/vendor/icons/search.svg')"></i><input id="skillSearchInput" type="search" placeholder="搜索技能" aria-label="搜索技能"></label></div>
        <div id="skillLibraryList" class="skill-library-list"></div>
      </aside>

      <aside id="inspectorDrawer" class="floating-drawer right-drawer hidden-drawer">
        <div class="drawer-header"><strong>属性</strong><button data-close-drawer="inspectorDrawer" class="icon-btn" title="关闭" aria-label="关闭"><i class="ui-icon" style="--icon:url('/vendor/icons/x.svg')"></i></button></div>
        <div id="previewStage" class="preview-stage"></div>
        <div class="preview-controls"><button id="previewPlayBtn" class="icon-btn"><i class="ui-icon" style="--icon:url('/vendor/icons/player-play.svg')"></i><span>播放</span></button><span id="previewTime" class="muted"></span><span class="spacer"></span><button id="previewFullscreenBtn" class="icon-btn" title="全屏预览" aria-label="全屏预览"><i class="ui-icon" style="--icon:url('/vendor/icons/arrows-maximize.svg')"></i></button></div>
        <div id="inspector" class="inspector empty-state">选择节点、连线或 Timeline Clip</div>
        <div class="section-divider"></div>
        <div class="drawer-subtitle job-list-head"><span>生成任务</span><span id="jobSummary" class="job-summary"></span></div>
        <div class="job-filters" role="group" aria-label="任务筛选"><button type="button" data-job-filter="all" class="active">全部</button><button type="button" data-job-filter="active">进行中</button><button type="button" data-job-filter="failed">失败</button><button type="button" data-job-filter="succeeded">已完成</button><button id="archiveCompletedJobsBtn" type="button" title="隐藏已完成和已取消任务">归档完成</button></div>
        <div id="jobList" class="job-list"></div>
      </aside>

    </main>

    <section id="timelineShell" class="timeline-shell collapsed">
      <div class="timeline-header">
        <div><strong>时间线</strong><span id="timelineMeta" class="muted"></span><span id="timelineHint" class="timeline-hint" aria-live="polite"></span></div>
        <div class="timeline-actions">
          <button id="timelineUndoBtn" title="撤销" aria-label="撤销"><i class="ui-icon" style="--icon:url('/vendor/icons/arrow-back-up.svg')"></i></button><button id="timelineRedoBtn" title="重做" aria-label="重做"><i class="ui-icon" style="--icon:url('/vendor/icons/arrow-forward-up.svg')"></i></button>
          <button id="addTextClipBtn"><i class="ui-icon" style="--icon:url('/vendor/icons/file-text.svg')"></i><span>字幕</span></button>
          <button id="timelineZoomOutBtn" title="缩小" aria-label="缩小"><i class="ui-icon" style="--icon:url('/vendor/icons/minus.svg')"></i></button><span id="timelineZoomLabel" class="muted">100%</span><button id="timelineZoomInBtn" title="放大" aria-label="放大"><i class="ui-icon" style="--icon:url('/vendor/icons/plus.svg')"></i></button>
          <button id="splitClipBtn" disabled><i class="ui-icon" style="--icon:url('/vendor/icons/cut.svg')"></i><span>切分</span></button><button id="duplicateClipBtn" disabled><i class="ui-icon" style="--icon:url('/vendor/icons/copy.svg')"></i><span>复制</span></button><button id="crossfadeBtn" disabled><i class="ui-icon" style="--icon:url('/vendor/icons/layers-subtract.svg')"></i><span>叠化</span></button>
          <button id="timelineRefBtn" disabled><i class="ui-icon" style="--icon:url('/vendor/icons/link.svg')"></i><span>作为 AI 参考</span></button><button id="rippleDeleteBtn" disabled><i class="ui-icon" style="--icon:url('/vendor/icons/trash-x.svg')"></i><span>波纹删除</span></button><button id="deleteClipBtn" disabled><i class="ui-icon" style="--icon:url('/vendor/icons/trash.svg')"></i><span>删除</span></button>
          <button id="timelineCloseBtn" title="收起时间线" aria-label="收起时间线"><i class="ui-icon" style="--icon:url('/vendor/icons/chevron-down.svg')"></i></button>
        </div>
      </div>
      <div class="timeline-ruler" id="timelineRuler"></div><div class="timeline-body" id="timelineBody"></div>
    </section>
  </div>

  <section id="agentOverlay" class="agent-overlay hidden" aria-label="创意 Agent">
    <div id="agentResizer" class="agent-resizer" role="separator" aria-orientation="vertical" aria-label="调整 Agent 面板宽度" tabindex="0"></div>
    <div class="agent-panel">
      <header class="drawer-header agent-panel-header">
        <strong id="agentConversationTitle">创意对话</strong>
        <div>
          <button id="agentFavoritesBtn" class="icon-btn" type="button" title="收藏夹" aria-label="收藏夹" aria-pressed="false"><i class="ui-icon" style="--icon:url('/vendor/icons/star.svg')"></i></button>
          <button id="agentHistoryBtn" class="icon-btn" type="button" title="历史" aria-label="历史"><i class="ui-icon" style="--icon:url('/vendor/icons/history.svg')"></i></button>
          <button id="agentNewConversationBtn" class="icon-btn" type="button" title="新会话" aria-label="新会话"><i class="ui-icon" style="--icon:url('/vendor/icons/plus.svg')"></i></button>
          <button id="agentCloseBtn" class="icon-btn" type="button" title="关闭" aria-label="关闭 Agent"><i class="ui-icon" style="--icon:url('/vendor/icons/x.svg')"></i></button>
        </div>
      </header>
      <div id="agentHistoryMenu" class="agent-history-menu hidden" role="menu"></div>
      <div id="agentMessages" class="agent-messages" aria-live="polite">
        <div id="agentEmptyState" class="agent-empty-state">
          <div class="agent-empty-hero" aria-hidden="true">
            <div class="agent-empty-glow"></div>
            <div class="agent-empty-mark"><i class="ui-icon" style="--icon:url('/vendor/icons/bulb.svg')"></i></div>
          </div>
          <div class="agent-empty-copy">
            <h2>把模糊想法聊清楚</h2>
            <p>从主题、角色、风格或镜头方向开始。对话只给建议；使用技能才会改画布。</p>
          </div>
          <div class="agent-starters">
            <span class="agent-starters-label">快速开始</span>
            <button type="button" class="agent-starter" data-agent-prompt="帮我发散三个完全不同的创意方向" data-agent-send="1">
              <span class="agent-starter-icon"><i class="ui-icon" style="--icon:url('/vendor/icons/sparkles-2.svg')"></i></span>
              <span class="agent-starter-copy"><strong>发散方向</strong><small>从一个模糊想法找到三条路</small></span>
              <i class="ui-icon agent-starter-arrow" style="--icon:url('/vendor/icons/arrow-up-right.svg')"></i>
            </button>
            <button type="button" class="agent-starter" data-agent-prompt="帮我设计这个项目的视觉风格和色彩基调" data-agent-send="1">
              <span class="agent-starter-icon"><i class="ui-icon" style="--icon:url('/vendor/icons/palette.svg')"></i></span>
              <span class="agent-starter-copy"><strong>建立风格</strong><small>确定画面气质和视觉语言</small></span>
              <i class="ui-icon agent-starter-arrow" style="--icon:url('/vendor/icons/arrow-up-right.svg')"></i>
            </button>
            <button type="button" class="agent-starter" data-agent-prompt="帮我把这个想法拆成几个有画面感的场景" data-agent-send="1">
              <span class="agent-starter-icon"><i class="ui-icon" style="--icon:url('/vendor/icons/layout-grid.svg')"></i></span>
              <span class="agent-starter-copy"><strong>拆解场景</strong><small>把概念变成可讨论的画面</small></span>
              <i class="ui-icon agent-starter-arrow" style="--icon:url('/vendor/icons/arrow-up-right.svg')"></i>
            </button>
          </div>
        </div>
      </div>
      <form id="agentPromptForm" class="agent-prompt-form" data-promptbar>
        <div class="agent-prompt-anchor">
          <div id="agentPromptSourceMenu" class="agent-prompt-source-menu hidden" role="menu"></div>
          <div id="agentAttachmentPreview" class="agent-attachment-preview hidden" aria-label="已添加的参考文件"></div>
          <div class="agent-prompt-composer">
            <div id="agentSkillChip" class="agent-skill-chip hidden"></div>
            <textarea id="agentPromptInput" rows="1" placeholder="写下一个想法…" aria-label="创意输入"></textarea>
            <div class="agent-prompt-controls">
              <button id="agentPromptPlusBtn" class="agent-prompt-control" type="button" aria-label="上传文件" title="上传文件"><i class="ui-icon" style="--icon:url('/vendor/icons/upload.svg')"></i></button>
              <button id="agentSkillBtn" class="agent-prompt-control" type="button" aria-label="选择技能" title="选择技能" aria-expanded="false" aria-haspopup="menu"><i class="ui-icon" style="--icon:url('/vendor/icons/sparkles-2.svg')"></i></button>
              <div id="agentModelSelect" class="agent-model-select"></div>
              <button id="agentDictationBtn" class="agent-prompt-control" type="button" aria-label="语音输入" title="语音输入"><i class="ui-icon" style="--icon:url('/vendor/icons/microphone.svg')"></i></button>
              <button id="agentSendBtn" class="agent-send-btn" type="submit" aria-label="发送创意"><i class="ui-icon" style="--icon:url('/vendor/icons/arrow-up.svg')"></i></button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </section>

  <div id="nodeMenu" class="node-menu hidden" role="menu">
    <div id="nodeMenuContent" class="node-menu-content"></div>
  </div>

  <div id="nodeContextMenu" class="context-menu hidden"></div>

  <div id="createProjectModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="createProjectTitle">
    <section class="create-project-modal">
      <div class="modal-header"><strong id="createProjectTitle">新建画布</strong></div>
      <label class="create-project-field"><span>画布名称</span><input id="createProjectInput" class="ds-control-input" type="text" maxlength="120" autocomplete="off"></label>
      <div class="modal-footer"><button id="createProjectCancel" type="button">取消</button><button id="createProjectConfirm" type="button" class="primary">创建画布</button></div>
    </section>
  </div>

  <div id="deleteProjectModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="deleteProjectTitle">
    <section class="create-project-modal">
      <div class="modal-header"><strong id="deleteProjectTitle">删除画布</strong></div>
      <p id="deleteProjectMessage" class="delete-project-message"></p>
      <div class="modal-footer"><button id="deleteProjectCancel" type="button">取消</button><button id="deleteProjectConfirm" type="button" class="danger">删除画布</button></div>
    </section>
  </div>

  <div id="providerModal" class="modal-backdrop hidden">
    <section class="provider-modal">
      <div class="modal-header"><div><strong>模型 / API</strong><small>APIMart 输入 API Key 后自动拉取可用模型；密钥只保存在本机</small></div><button id="providerModalClose" class="icon-btn" title="关闭" aria-label="关闭"><i class="ui-icon" style="--icon:url('/vendor/icons/x.svg')"></i></button></div>
      <div id="providerSettingsForm" class="provider-settings-form"></div>
      <div class="modal-footer"><span id="providerSaveStatus" class="muted"></span><button id="providerSaveBtn" class="primary">保存配置</button></div>
    </section>
  </div>

  <div id="helpModal" class="modal-backdrop hidden">
    <section class="help-modal"><div class="modal-header"><strong>画布快捷键</strong><button id="helpModalClose" class="icon-btn" title="关闭" aria-label="关闭"><i class="ui-icon" style="--icon:url('/vendor/icons/x.svg')"></i></button></div><div class="help-grid">
      <div><kbd>双击</kbd><span>添加节点</span></div><div><kbd>节点右键</kbd><span>节点菜单</span></div>
      <div><kbd>V</kbd><span>选择工具</span></div><div><kbd>H / Space</kbd><span>抓手工具</span></div>
      <div><kbd>C</kbd><span>连线工具</span></div><div><kbd>Delete</kbd><span>删除选中</span></div>
      <div><kbd>⌘/Ctrl Z</kbd><span>撤销</span></div><div><kbd>F</kbd><span>适配画布</span></div>
    </div></section>
  </div>

  <div id="previewFullscreenModal" class="preview-fullscreen-overlay hidden" aria-label="全屏预览">
    <div class="preview-fullscreen-content">
      <div id="previewFullscreenStage" class="preview-fullscreen-stage"></div>
      <div class="preview-fullscreen-controls">
        <button id="previewFullscreenPlayBtn" class="icon-btn"><i class="ui-icon" style="--icon:url('/vendor/icons/player-play.svg')"></i><span>播放</span></button>
        <span id="previewFullscreenTime" class="muted"></span>
        <span class="spacer"></span>
        <button id="previewFullscreenCloseBtn" class="icon-btn" title="关闭 (Esc)" aria-label="关闭"><i class="ui-icon" style="--icon:url('/vendor/icons/x.svg')"></i></button>
      </div>
    </div>
  </div>

  <div id="mediaLightbox" class="media-lightbox hidden" role="dialog" aria-modal="true" aria-label="媒体预览">
    <div class="media-lightbox-content">
      <button id="mediaLightboxClose" class="media-lightbox-close icon-btn" title="关闭 (Esc)" aria-label="关闭预览"><i class="ui-icon" style="--icon:url('/vendor/icons/x.svg')"></i></button>
      <div id="mediaLightboxStage" class="media-lightbox-stage"></div>
    </div>
  </div>

  <div id="assetPromptModal" class="asset-prompt-modal hidden" role="dialog" aria-modal="true" aria-label="素材提示词">
    <section class="asset-prompt-panel">
      <div class="asset-prompt-header"><strong>图片提示词</strong><div><button id="assetPromptCopy"><i class="ui-icon" style="--icon:url('/vendor/icons/copy.svg')"></i><span>复制</span></button><button id="assetPromptClose" class="icon-btn" title="关闭 (Esc)" aria-label="关闭提示词"><i class="ui-icon" style="--icon:url('/vendor/icons/x.svg')"></i></button></div></div>
      <textarea id="assetPromptText" class="asset-prompt-text" readonly aria-label="完整提示词"></textarea>
    </section>
  </div>

  <div id="skillDetailModal" class="modal-backdrop skill-detail-modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="skillDetailTitle">
    <section class="skill-detail-modal" role="document">
      <div id="skillDetailBody" class="skill-detail-modal-body"></div>
    </section>
  </div>

  <div id="textOutputModal" class="text-output-modal hidden" role="dialog" aria-modal="true" aria-label="脚本全文">
    <section class="text-output-page">
      <div class="modal-header text-output-header">
        <div><strong id="textOutputTitle">脚本全文</strong><small id="textOutputMeta">完整查看和修改文本生成结果</small></div>
